services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: getcourse_ai
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/01-create-test-database.sql:/docker-entrypoint-initdb.d/01-create-test-database.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d getcourse_ai"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data: